name: CI/CD - Pedido

on:
  pull_request:
    branches: [ main ]
  push:
    branches: [ main ]

jobs:
  ci:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    name: Build, Test & Coverage
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'

      - name: Configure UTF-8
        run: |
          export DOTNET_CLI_UI_LANGUAGE=en
          export DOTNET_CLI_TELEMETRY_OPTOUT=1
          export DOTNET_CLI_HOME=$HOME
          export LC_ALL=C.UTF-8
          export LANG=C.UTF-8

      - name: Restore dependencies
        run: dotnet restore Pedido/Pedido.sln

      - name: Build
        run: dotnet build Pedido/Pedido.sln --no-restore --configuration Release

      - name: Run Tests
        run: dotnet test Pedido/Pedido.sln --no-build --configuration Release --collect:"XPlat Code Coverage"

  cd:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Deploy Local
    steps:
      - uses: actions/checkout@v3

      # Build Docker Image - contexto correto
      - name: Build Docker Image
        run: docker build -t microservico-pedido:latest ./Pedido

      - name: Run Docker Container
        run: |
          docker rm -f microservico-pedido || true
          docker run -d -p 5000:8080 --name microservico-pedido microservico-pedido:latest
